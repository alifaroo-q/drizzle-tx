packages:
  - 'packages/*'

# Supply-chain hardening (post Shai-Hulud). minimumReleaseAge quarantines
# freshly-published versions from lockfile updates (local + Dependabot/Renovate;
# --frozen-lockfile CI installs are unaffected). strictDepBuilds turns an
# *undecided* dependency build script into a hard error, so a new transitive dep
# that ships an install script fails the build instead of silently running it.
minimumReleaseAge: 1440 # minutes (1 day)
strictDepBuilds: true

# Explicit build-script decisions (pnpm 11 `allowBuilds` map). Every
# script-bearing dependency must be decided true/false or strictDepBuilds errors.
allowBuilds:
  '@swc/core': true # SWC native binding (nestjs Vitest transform)
  esbuild: true # esbuild platform binary (Vite/Vitest)
  cpu-features: false # Testcontainers/ssh2 optional native probe — not needed
  protobufjs: false # no codegen build required
  ssh2: false # Testcontainers transport works without the native crypto build

catalog:
  typescript: 7.0.2
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  vitest: 4.1.10
  '@vitest/coverage-v8': 4.1.10
  '@vitest/ui': 4.1.10
  pg: ^8.22.0
  '@types/pg': ^8.20.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1
  '@nestjs/common': ^11.1.28
  '@nestjs/core': ^11.1.28
  '@testcontainers/postgresql': ^12.0.4
