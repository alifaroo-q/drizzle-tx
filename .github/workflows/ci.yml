name: CI
on:
  push: { branches: [main] }
  pull_request: {}

# Least privilege by default; no job here writes to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push obsoletes the old CI).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      # Report every Node leg even if one fails — a 24-only regression must not
      # hide the 22 result (and vice-versa).
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build first: @drizzle-tx/nestjs typechecks against @drizzle-tx/core's built
      # dist/*.d.ts (resolved via its exports map), so core must be built beforehand.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test # Docker preinstalled on ubuntu runners → Testcontainers works
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - run: pnpm -r run check:publish

  # Fail a PR that changes a published package without adding a changeset.
  changeset-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # changeset status --since needs the base-branch history
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git fetch origin "${{ github.base_ref }}" --depth=1
      - run: pnpm changeset status --since="origin/${{ github.base_ref }}"
