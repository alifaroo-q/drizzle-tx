name: CI
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build first: @drizzle-tx/nestjs typechecks against @drizzle-tx/core's built
      # dist/*.d.ts (resolved via its exports map), so core must be built beforehand.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test # Docker preinstalled on ubuntu runners → Testcontainers works
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - run: pnpm -r run check:publish
