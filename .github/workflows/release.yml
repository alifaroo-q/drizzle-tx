name: Release
on:
  push: { branches: [main] }

# Least privilege by default; the release job opts into the writes it needs.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets pushes the "Version Packages" PR / tags
      pull-requests: write # ...and opens/updates that PR
      id-token: write # OIDC → npm trusted publishing + provenance (PRD §Security)
    steps:
      # No persist-credentials:false here — changesets/action pushes to the repo.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npm install -g npm@latest # ensure npm >= 11.5.1 for auto-provenance
      - run: pnpm build
      # Publish gate: a broken exports/types map can never reach npm even if a
      # branch-protection bypass skipped CI.
      - run: pnpm -r run check:publish
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true' # belt-and-suspenders; auto under trusted publishing
