name: Release
on:
  push: { branches: [main] }
  workflow_dispatch: # allow manual re-trigger of a release run from the Actions tab

# Least privilege by default; the release job opts into the writes it needs.
permissions:
  contents: read

jobs:
  # Gate: only run the release job when a push can actually produce a release —
  # i.e. it carries pending changesets (→ open/update the Version PR) or bumps a
  # published package.json version (→ the merged Version PR that should publish).
  # Docs/chore/CI pushes touch neither and skip the release job entirely, so they
  # never hit changesets' re-publish-an-already-published-version crash
  # (stale `npm info` + `@changesets/cli` reading pnpm's E403 as `.summary`). This
  # decides from git alone — no npm reads — so it is immune to that staleness.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { fetch-depth: 0 } # need history to diff the push range
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run() { echo "should_run=$1" >> "$GITHUB_OUTPUT"; echo "decision: $1 ($2)"; exit 0; }

          # Manual dispatch is always an intentional release attempt.
          [ "$EVENT" = "workflow_dispatch" ] && run true "workflow_dispatch"

          # Pending changesets in the tree → changesets/action opens/updates the Version PR.
          if ls .changeset/*.md >/dev/null 2>&1 && ls .changeset/*.md | grep -qv 'README\.md'; then
            run true "pending changesets"
          fi

          # A version bump in any published manifest → the merged Version PR that publishes.
          base="$BEFORE"
          if ! git rev-parse -q --verify "${base}^{commit}" >/dev/null 2>&1; then
            base="$(git rev-parse -q --verify HEAD~1 || true)"
          fi
          # Can't establish a diff base (e.g. branch (re)create) → run, never miss a release.
          [ -z "$base" ] && run true "no diff base"
          if git diff "$base" "$SHA" -- 'packages/*/package.json' | grep -qE '^\+[[:space:]]*"version":'; then
            run true "package.json version changed"
          fi

          run false "no changesets or version bump"

  release:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Disable Husky for the whole job: changesets/action's "Version Packages" commit runs
    # `git commit`, which fires the `.husky/pre-commit` hook (`mise exec -- pnpm lint:fix`).
    # CI has no `mise` on PATH → the hook exits 127 and fails the commit → the release job
    # dies before it can open the Version PR. Hooks are a local-dev convenience; skip them
    # here (husky v9 honors HUSKY=0 via `.husky/_/h`).
    env:
      HUSKY: 0
    permissions:
      contents: write # changesets pushes the "Version Packages" PR / tags
      pull-requests: write # ...and opens/updates that PR
      id-token: write # OIDC → npm trusted publishing + provenance (PRD §Security)
    steps:
      # No persist-credentials:false here — changesets/action pushes to the repo.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npm install -g npm@latest # ensure npm >= 11.5.1 for auto-provenance
      - run: pnpm build
      # Publish gate: a broken exports/types map can never reach npm even if a
      # branch-protection bypass skipped CI.
      - run: pnpm -r run check:publish
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true' # belt-and-suspenders; auto under trusted publishing
